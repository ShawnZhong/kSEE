[workspace]
resolver = "3"
members = ["crates/ksee-core", "crates/ksee-host", "crates/ksee-cli", "crates/ksee-page"]
# (Natively: ksee-host and ksee-page build for wasm32 only, as ksee.sh builds them.)
default-members = ["crates/ksee-core", "crates/ksee-cli"]

[workspace.package]
edition = "2024"
publish = false

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
