[package]
name = "ksee-page"
version = "0.1.0"
description = "kSEE's page, in Rust (Dioxus), with the runtime in the same wasm module"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ksee-core = { path = "../ksee-core" }
ksee-host = { path = "../ksee-host" }
dioxus = { version = "0.7.10", default-features = false, features = ["web", "macro", "html", "signals", "hooks", "launch", "mounted"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = ["Window", "Response", "Document", "Element", "Event", "EventTarget", "HtmlCanvasElement", "CanvasRenderingContext2d", "CssStyleDeclaration", "DomRect", "HtmlElement", "HtmlTextAreaElement", "KeyboardEvent", "Location", "History", "console", "Storage"] }

[features]
# (The tests run in the page: the kernel integration and DOM suites in src/test/.)
browser-tests = ["web-sys/HtmlElement", "web-sys/HtmlInputElement", "web-sys/EventInit", "web-sys/KeyboardEvent",
            "web-sys/KeyboardEventInit", "web-sys/MouseEvent", "web-sys/MouseEventInit", "web-sys/PointerEvent", "web-sys/PointerEventInit", "web-sys/WheelEvent", "web-sys/WheelEventInit",
            "web-sys/DomRect", "web-sys/NodeList", "web-sys/Request", "web-sys/RequestInit"]
