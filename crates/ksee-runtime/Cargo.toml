[package]
name = "ksee-runtime"
version = "0.1.0"
description = "kSEE host runtime: the kernel's host, on the page's thread (wasm-bindgen, JSPI)"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ksee-core = { path = "../ksee-core", features = ["serde"] }
serde-wasm-bindgen = "0.6.5"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = ["console", "Performance", "Response"] }
