[package]
name = "ksee-cli"
version = "0.1.0"
description = "kSEE command line: build, test and serve the page, pack the kernel for it"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ksee"
path = "src/main.rs"

[dependencies]
ksee-core.workspace = true
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
serde_json = "1.0.151"
# (wasm-bindgen-cli-support's version: one build of it.)
wasmparser = { version = "0.245", default-features = false, features = ["std"] }
wasm-bindgen-cli-support.workspace = true
