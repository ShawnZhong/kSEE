[package]
name = "ksee-cli"
version = "0.1.0"
description = "kSEE command line: decode trace dumps offline"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ksee"
path = "src/main.rs"

[dependencies]
ksee-core = { path = "../ksee-core" }
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
