[package]
name = "ksee-cli"
version = "0.1.0"
description = "kSEE command line: build, test and serve the page, pack the kernel for it"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ksee"
path = "src/main.rs"

[dependencies]
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
wasm-bindgen-cli-support = "=0.2.128"
