name: CI
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: linux
          key: linux-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-llvm22-${{ hashFiles('linux.patch', 'plugin/ksee-trace.cpp', 'crates/ksee-cli/src/build.rs') }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ksee-core -p ksee-cli
      - run: ./setup.sh --rust-only
      - run: wasm-bindgen --version
      - run: ./ksee.sh build
