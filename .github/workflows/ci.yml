name: CI
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Restore Linux build cache
        uses: actions/cache@v5
        with:
          path: |
            linux
            !linux/.git
          key: linux-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-llvm22-${{ hashFiles('linux.patch', 'arch/wasm/**', 'plugin/ksee-trace.cpp', 'Makefile') }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build the kernel, plugin and initramfs (cached linux/)
        run: make -j$(nproc)
      - name: Build ksee CLI
        run: cargo build --locked --release -p ksee-cli
      - name: Build the site
        run: target/release/ksee build
      - name: Test
        run: target/release/ksee test --built
