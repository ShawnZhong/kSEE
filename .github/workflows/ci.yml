name: CI
on: [push, pull_request]

# The kernel is its own job, cached by what builds it (the port, the
# plugin, the Makefile's Linux lines), so a change elsewhere reuses it; saved
# even when the tests fail. The cache: linux/, arch/wasm/ (its objects, which
# kbuild writes through the link, and its sources), the plugin. Restored
# over the checkout, the sources are as old as the objects: nothing rebuilt.
jobs:
  kernel:
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: What builds the kernel
        id: key
        run: |
          # (The port, the plugin, and the Makefile's lines for Linux: its
          # release and kbuild's command.)
          make=$(grep -E '^(LINUX_|KMAKE|	KCFLAGS)' Makefile | sha256sum | cut -c1-16)
          echo "key=linux-v3-${{ runner.arch }}-llvm22-${{ hashFiles('linux.patch', 'arch/wasm/**', 'plugin/ksee-trace.cpp') }}-$make" >> "$GITHUB_OUTPUT"
      - name: Restore the kernel
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            linux
            !linux/.git
            arch/wasm
            plugin/ksee-trace.cpp
            plugin/ksee-trace.so
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Build the kernel
        if: steps.cache.outputs.cache-hit != 'true'
        run: make -j$(nproc) linux/vmlinux
      - name: Save the kernel
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            linux
            !linux/.git
            arch/wasm
            plugin/ksee-trace.cpp
            plugin/ksee-trace.so
          key: ${{ steps.key.outputs.key }}

  test:
    needs: kernel
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Restore the kernel
        uses: actions/cache/restore@v5
        with:
          path: |
            linux
            !linux/.git
            arch/wasm
            plugin/ksee-trace.cpp
            plugin/ksee-trace.so
          key: ${{ needs.kernel.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build ksee CLI
        run: cargo build --locked --release -p ksee-cli
      - name: Build the site (the user programs, the initramfs, the page)
        run: target/release/ksee build
      - name: Test
        run: target/release/ksee test --built --ui
