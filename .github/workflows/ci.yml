name: CI
on: [push, pull_request]

# The kernel is cached by what builds it (the Makefile, the patch, the port,
# the plugin), saved once built, before the tests (kept even when they
# fail). The cache: linux/, the tree; target/linux/, kbuild's output; and
# arch/wasm/, the port's sources, restored over the checkout as old as the
# objects, so nothing is rebuilt.
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore the kernel
        id: kernel
        uses: actions/cache/restore@v5
        with:
          path: |
            linux
            !linux/.git
            target/linux
            arch/wasm
          key: linux-${{ runner.arch }}-${{ hashFiles('Makefile', 'linux.patch', 'arch/wasm/**', 'plugin/**') }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: ./ksee.sh build
      - name: Save the kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            linux
            !linux/.git
            target/linux
            arch/wasm
          key: ${{ steps.kernel.outputs.cache-primary-key }}
      - name: Test
        run: ./ksee.sh test --built --ui
