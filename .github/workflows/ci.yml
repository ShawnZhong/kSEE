name: CI
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Restore Linux build cache
        uses: actions/cache@v4
        with:
          path: |
            linux
            !linux/.git
          key: linux-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-llvm22-${{ hashFiles('linux.patch', 'plugin/ksee-trace.cpp', 'crates/ksee-cli/src/build.rs') }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run Rust unit tests
        run: cargo test --locked --release -p ksee-core -p ksee-cli
      - name: Install Rust/Wasm tools
        run: ./setup.sh --rust-only
      - name: Build CLI
        run: cargo build --locked --release -p ksee-cli
      - name: Build site
        run: ./target/release/ksee build
