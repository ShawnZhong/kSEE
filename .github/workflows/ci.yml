name: CI
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ksee-core -p ksee-cli
      - run: ./setup.sh
      - run: wasm-bindgen --version
      - run: ./ksee.sh build
