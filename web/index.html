<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kSEE — watch the Linux kernel run</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#fbfbfa, #0d1117); --panel: light-dark(#fff, #161b22); --fg: light-dark(#1f2328, #e6edf3);
  --dim: light-dark(#6b7280, #8b949e); --line: light-dark(#e3e3e0, #30363d);
  --sel: light-dark(#e8f0fe, #1f2d3d); --ran: light-dark(#dafbe1, #12301c); --miss: light-dark(#cf222e, #f85149);
  --accent: light-dark(#0969da, #58a6ff);
  --at: light-dark(#fff3bf, #3d3207); --chg: light-dark(#fff8c5, #3a3000); --run: light-dark(#1a7f37, #3fb950);
  --found: light-dark(#f0a6f7, #c86fd0);
  --kw: light-dark(#8250df, #d2a8ff); --ty: light-dark(#0550ae, #79c0ff); --str: light-dark(#0a3069, #a5d6ff);
  --com: light-dark(#6e7781, #8b949e); --num: light-dark(#0550ae, #79c0ff); --pp: light-dark(#953800, #ffa657);
  --fn: light-dark(#0000ff, #61afef); --fld: light-dark(#0000cc, #e06c75); --mac: light-dark(#225566, #e06c75);
  --bl: light-dark(#221199, #d19a66); --esc: light-dark(#ee4400, #56b6c2);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
/* The theme, kept (ksee.theme): data-theme="light" forces light,
   data-theme="dark" forces dark, absent follows the system. */
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

/* The page */
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; }
#root { height: 100%; display: flex; flex-direction: column; }
a { color: var(--accent); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--fg); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { color: var(--dim); cursor: default; opacity: .6; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dim { color: var(--dim); }
.mono, code, textarea { font-family: var(--mono); font-size: 12px; }
.pad { padding: 8px 12px; }

/* The layout: the lesson | the work (the timeline over the source and the tabs); the splits */
.page { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--left) 5px minmax(0, 1fr); }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); position: relative; }
.lesson { overflow: auto; flex: 1; min-height: 0; padding-bottom: 24px; }
.work { display: flex; flex-direction: column; min-width: 0; min-height: 0; outline: none; }
.below { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 1fr) 5px var(--right); }
.vsplit { cursor: col-resize; background: var(--line); opacity: .5; }
.hsplit { cursor: row-resize; height: 4px; background: var(--line); opacity: .5; flex: none; }
.vsplit:hover, .hsplit:hover { background: var(--accent); opacity: .6; }
.sheet { position: fixed; inset: 0; z-index: 50; }

/* The top bar, the page's own: the lessons (the contents, the one before and the next), the theme */
.topbar { display: flex; gap: 4px; align-items: center; padding: 4px 8px 4px 12px; background: var(--panel);
  border-bottom: 1px solid var(--line); flex: none; position: relative; }
.topbar b { font-size: 14px; }
.topbar .contents.on { background: var(--sel); border-color: var(--accent); color: var(--accent); }
.topbar .crumb { margin-left: 8px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
.topbar .keys { margin-left: auto; font-size: 11px; cursor: help; border-bottom: 1px dotted var(--dim); }
.topbar .theme { margin-left: 8px; }
.topbar .menu { top: 100%; left: 0; width: min(340px, 92vw); max-height: 70dvh; }
.menuback { position: fixed; inset: 0; z-index: 9; }
.menu { position: absolute; z-index: 10; overflow-y: auto; background: var(--panel);
  border-top: 1px solid var(--line); padding: 4px 0 12px; box-shadow: 0 6px 16px rgb(0 0 0 / .12); }
.menu .chapter { margin: 12px 12px 2px; font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
.menu .item { display: block; position: relative; padding: 4px 12px 4px 30px; color: var(--fg); }
.menu .item:hover { background: var(--sel); text-decoration: none; }
.menu .item.on { background: var(--sel); font-weight: 600; }
.menu .tick { position: absolute; left: 13px; color: var(--run); }

/* A lesson: its chapter and place, title, question, explanation; the lessons before and next */
h1 { margin: 12px 12px 0; font-size: 17px; line-height: 1.3; font-weight: 600; }
.question { color: var(--dim); margin: 0; padding: 6px 12px 0; }
.explain { margin: 8px 12px; font-size: 12.5px; }
.explain p { margin: 0 0 8px; }
.explain .place { font-size: 12px; }
.explain a.try { border: 1px solid var(--accent); border-radius: 3px; padding: 0 5px; font-size: 12px; white-space: nowrap; }
.explain a.try:hover { text-decoration: none; background: var(--sel); }
.pager { display: flex; gap: 12px; margin: 4px 12px 10px; font-size: 12px; }
.pager .after { margin-left: auto; text-align: right; font-weight: 600; }

/* The program: a line each (its editor, its result); a column per task */
.ptitle { margin: 10px 12px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: baseline; }
.ptitle a { margin-left: auto; text-transform: none; letter-spacing: 0; }
.program { overflow-x: auto; }
ol.steps { margin: 8px 12px; padding-left: 22px; }
ol.steps > li { margin: 4px 0; }
ol.steps > li.add { list-style: none; }
.cell { border-radius: 3px; padding: 1px 2px; }
.cell.on { background: var(--sel); }
.cell .line { display: flex; align-items: baseline; gap: 0 6px; flex-wrap: wrap; }
.cell .rm { color: var(--dim); font-size: 11px; visibility: hidden; }
.cell:hover .rm { visibility: visible; }
.cell .ret { color: var(--accent); margin-left: auto; white-space: nowrap; }
.cell.blocked .ret { color: var(--pp); font-style: italic; }
.cell .more { font-size: 11px; padding: 0 2px; overflow-wrap: anywhere; }
ol.steps.columns, .taskheads { --col: 300px; }
ol.steps.columns { width: max-content; }
ol.steps.columns > li.row { display: grid; grid-template-columns: repeat(var(--columns), var(--col)); column-gap: 10px; }
ol.steps.columns > li.row > .cell { grid-row: 1; }
ol.steps.columns > li:not(.add) > .cell { border-left: 3px solid hsl(var(--hue) 50% 62%); padding-left: 5px; border-radius: 0; }
ol.steps.columns > li.row > .wait { grid-row: 1; border-left: 3px dotted hsl(var(--hue) 50% 62%); min-height: 1.4em; }
.taskheads { display: grid; grid-template-columns: repeat(var(--columns), var(--col)); column-gap: 10px; margin: 4px 12px 0 34px; width: max-content; }
.taskheads .task { font-size: 11px; border-bottom: 2px solid hsl(var(--hue) 50% 62%); padding: 2px 5px; }

/* A line's editor: completions, the signature */
.editor { flex: 1; position: relative; min-width: 0; }
.editor textarea { width: 100%; font: 12px/1.45 var(--mono); padding: 1px 2px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: var(--fg);
  outline: none; resize: none; field-sizing: content; overflow: hidden; display: block; }
.editor textarea:hover { border-color: var(--line); }
.editor textarea:focus { border-color: var(--accent); background: var(--panel); }
li.add .editor textarea { border-color: var(--line); background: var(--panel); padding: 2px 6px; }
.complete { position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin: 2px 0 0; padding: 2px 0; list-style: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 3px; max-height: 240px; overflow-y: auto; box-shadow: 0 4px 12px rgb(0 0 0 / .15); font-size: 12px; }
.complete li { padding: 1px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.complete li.on { background: var(--sel); }
.hint { font-size: 11px; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.error { color: var(--miss); font-size: 12px; margin-top: 2px; }

/* The timeline: the overview, the stack chart, the task strip, the transport */
.history { border-bottom: 1px solid var(--line); background: var(--panel); padding: 4px 12px; flex: none; }
.overview { position: relative; height: 18px; cursor: pointer; }
.overview .b { position: absolute; top: 3px; bottom: 3px; }
.overview .start { position: absolute; bottom: 0; height: 4px; width: 1px; background: var(--accent); }
.overview .win { position: absolute; top: 1px; bottom: 1px; border: 1.5px solid var(--accent); pointer-events: none; }
.overview .at { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); pointer-events: none; }
.flamehead { display: flex; gap: 12px; align-items: center; font-size: 11.5px; padding: 4px 0 2px; white-space: nowrap; }
.find { font-size: 11px; width: 12em; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--fg); }
.find:focus { outline: none; border-color: var(--accent); }
.legend { margin-left: auto; display: flex; gap: 8px; color: var(--dim); overflow: hidden; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
.flamescroll { height: var(--chart); overflow: hidden auto; overscroll-behavior: contain; display: flex; flex-direction: column-reverse; }
.chart { position: relative; flex: none; cursor: crosshair; }
.chart .bar { pointer-events: none; position: absolute; padding: 0 3px; font: 11px var(--mono); overflow: hidden; white-space: nowrap; color: #1f2328; box-shadow: inset -1px 0 var(--panel); }
.chart .bar.on { color: #fff; }
.chart .bar.lit { outline: 1.5px solid var(--fg); outline-offset: -1.5px; z-index: 2; }
.chart .now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); pointer-events: none; z-index: 3; }
.chart .now.peek { opacity: .3; }
.strip { position: relative; height: 12px; }
.strip .run { position: absolute; top: 0; height: 12px; font: 10px/12px var(--mono); overflow: hidden; white-space: nowrap; padding: 0 3px; color: #1f2328; box-shadow: inset -1px 0 var(--panel); }
.transport { display: flex; gap: 4px; align-items: center; padding-top: 4px; font-size: 11.5px; }
.transport .where { margin-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* A tip (the chart's hover, a name's in the source) */
.tip { position: fixed; z-index: 60; max-width: 420px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; box-shadow: 0 4px 16px rgb(0 0 0 / .15); font: 12px/1.5 var(--mono); pointer-events: none; white-space: pre-wrap; }
.tip .f { padding-left: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tip .dim { font-family: system-ui, sans-serif; font-size: 11px; margin-top: 2px; }

/* The source: the lines that ran, the function, the cursor's line and its values */
.source { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
.srcbar { display: flex; gap: 8px; padding: 3px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; color: var(--dim); flex: none; }
.source .scroll { flex: 1; overflow: auto; min-height: 0; overflow-anchor: none; }
.code .ln { white-space: pre; padding-right: 10px; height: 17px; line-height: 17px; overflow: hidden; }
.code .ln.ran { background: var(--ran); }
.code .ln.infn { box-shadow: inset 3px 0 var(--accent); }
.code .ln.seen { background: var(--at); }
.code .ln.now { background: var(--sel); }
.code .no { display: inline-block; width: 5em; text-align: right; padding-right: 12px; color: var(--dim); user-select: none; cursor: pointer; }
.code .ln.now .no::before { content: "▶ "; color: var(--run); font-size: 11px; }
.code .no:hover { color: var(--accent); }
.code .kw { color: var(--kw); } .code .ty { color: var(--ty); } .code .str { color: var(--str); } .code .com { color: var(--com); font-style: italic; }
.code .num { color: var(--num); } .code .pp { color: var(--pp); }
.code .fn { color: var(--fn); } .code .fld { color: var(--fld); } .code .mac { color: var(--mac); } .code .bl { color: var(--bl); } .code .esc { color: var(--esc); }
.code .val { text-decoration: underline dotted var(--dim); text-underline-offset: 3px; cursor: help; }
.code a.stored { color: var(--dim); font-style: italic; margin-left: 3ch; display: inline-block; max-width: 45%; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
.code a.stored:hover { color: var(--accent); }
.code .values { color: var(--accent); font-style: italic; margin-left: 3ch; display: inline-block; max-width: 60%; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }

/* The tabs: the Stack, the Objects, the Tasks, the Console */
.panels { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: flex; padding: 0 4px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; flex: none; }
.tab { color: var(--dim); padding: 6px 8px; border-bottom: 2px solid transparent; }
.tab:hover { text-decoration: none; color: var(--fg); }
.tab.on { color: var(--fg); border-bottom-color: var(--accent); }
.pane { overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.stack { margin-top: auto; }
/* (The console kept at its end as it grows, unless scrolled back.) */
.pane:has(> .console) { flex-direction: column-reverse; }
table.objs { border-collapse: collapse; width: max-content; min-width: 100%; font-family: var(--mono); font-size: 12px; }
table.objs td { padding: 1px 8px; white-space: nowrap; }
table.objs tr:hover { background: var(--sel); }
table.objs td.fval { color: var(--accent); }
table.objs td.ftype { color: var(--dim); }
table.objs tr.none td { color: var(--dim); }
table.objs tr.frame td { padding: 5px 8px 2px; border-top: 1px solid var(--line); cursor: pointer; }
table.objs tr.frame.on td { background: var(--sel); }
table.objs tr.frame a { font-weight: 600; }
.tw { color: var(--dim); display: inline-block; width: 1.2em; }
tr.opens { cursor: pointer; }
.current { padding: 6px 8px; border-top: 1px solid var(--line); font-size: 12px; }
table.objs tr.later { opacity: .45; }
.stackhead { padding: 4px 12px; font-size: 11.5px; border-bottom: 1px solid var(--line); flex: none; }
/* The Objects: a box per object, a row a run of writes (the moment's marked, those after it gray) */
.objects { padding: 0 10px 12px; }
.ohead { padding: 6px 2px 2px; font-size: 11.5px; }
.obj { margin: 10px 0 0; font: 11px/1.5 var(--mono); }
.obj.under { border-left: 2px solid var(--line); padding-left: 6px; }
.obj .title { padding: 1px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; width: max-content; min-width: 100%; }
.obj td.fname { padding-left: 12px; }
.obj tr { cursor: pointer; }
.obj tr.on td { background: var(--at); }
.obj tr.same td { color: var(--dim); }
.obj tr.later td { opacity: .4; }
.console { margin: 0; padding: 6px 12px; font: 11px var(--mono); white-space: pre-wrap; word-break: break-word; }

/* A phone's screen: one under another, the page scrolling; no splits */
@media (max-width: 800px) {
  html, body { overflow: auto; }
  #root { height: auto; }
  .page, .below { display: block; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .vsplit, .hsplit, .legend { display: none; }
  .source, .panels { height: 70dvh; border-top: 1px solid var(--line); }
  .transport { flex-wrap: wrap; row-gap: 2px; }
  .transport button { padding: 4px 14px; }
  .topbar { flex-wrap: wrap; row-gap: 2px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
// (The theme kept, before the page is drawn: lesson.rs's Theme.)
const theme = localStorage.getItem("ksee.theme");
if (theme) document.documentElement.dataset.theme = theme;
</script>
<script type="module">
import { load, start } from "./ksee.js";
import { mount } from "./pkg/ksee_page.js";
// (The page at once; the kernel boots meanwhile, the page's once up.)
const [, examples] = await Promise.all([load(), fetch("examples.json").then((r) => r.json())]);
mount("root", examples, start({ kernel: new URL("vmlinux.gz", location.href), initrd: new URL("initramfs.cpio.gz", location.href) }));
</script>
</body>
</html>
