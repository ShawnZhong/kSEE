<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kSEE</title>
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<header><b>kSEE</b>
  <span id="badge" class="badge">loading</span><span id="status" class="dim">loading the kernel…</span>
  <span class="controls">
    <button id="record" title="Record the kernel (a tour records by itself)">● Record</button>
    <button id="pause" disabled title="Stop the kernel at its next basic block">Pause</button>
    <button id="cont" disabled title="Let the kernel run (until a breakpoint)">Continue</button>
  </span></header>
<section id="history">
  <canvas id="lanes" aria-label="history: tasks and their syscalls over the trace"></canvas>
  <div id="flamebox" hidden>
    <div class="flamehead"><span id="flame-title" class="dim"></span><span id="legend"></span></div>
    <div class="flamescroll" id="flamescroll"><canvas id="flame" aria-label="the calls of the selected syscall"></canvas></div>
  </div>
  <div class="transport">
    <button id="to-start" title="To the start">⏮</button>
    <button id="back-line" title="Back a line (←)">◀</button>
    <button id="play" class="go" title="Play: line by line (space)">▶ Play</button>
    <button id="fwd-line" title="Forward a line (→); at now, while paused, the kernel runs a line">▶|</button>
    <button id="over" title="Over: to the next line of this function (while paused)">⤼</button>
    <button id="now" title="Back to now">Now ⏭</button>
    <select id="speed" aria-label="speed" title="Play speed">
      <option value="1000">slow</option><option value="400" selected>1 line / 0.4 s</option><option value="120">fast</option><option value="30">faster</option>
    </select>
    <span id="where" class="mono dim"></span>
  </div>
</section>
<div class="hsplit" id="hsplit" title="drag to resize"></div>
<main id="main">
  <div class="col">
    <h2>Tours <span class="dim">programs, and what the kernel does for them</span></h2>
    <div class="body" id="tours"></div>
  </div>
  <div class="vsplit" data-col="left" title="drag to resize"></div>
  <div class="col">
    <div id="note" hidden></div>
    <div class="srcbar mono" id="fn-title">Source</div>
    <div class="body" id="src"><div class="empty">The source at the cursor: lines where blocks ran are green (with counts), untaken ones red. Click a line number to break there.</div></div>
  </div>
  <div class="vsplit" data-col="right" title="drag to resize"></div>
  <div class="col">
    <h2 class="tabs"><button id="tab-stack" class="on">Stack</button><button id="tab-console">Console <span id="console-new"></span></button>
      <span class="right dim" id="mem-note" title="Values are read from memory as it was at the cursor">memory now</span></h2>
    <div class="tab" id="pane-stack">
      <div class="stackhead dim" id="stack-note"></div>
      <div class="body" id="stack"></div>
      <form class="watchbar" id="watchf"><input id="watch" list="globals" placeholder="+ watch a global: runqueues, jiffies_64, …" aria-label="watch a global"><datalist id="globals"></datalist></form>
    </div>
    <div class="tab body" id="pane-console" hidden><pre id="console"></pre></div>
  </div>
</main>
<script type="module">
import { start } from "./ksee.js";
import { app } from "./app.js";

const params = new URLSearchParams(location.search);
// (window.ksee: for the console, and tests/ui.js)
window.ksee = app(await start({ kernel: "./vmlinux", initrd: "./initramfs.cpio", cmdline: params.get("cmdline") ?? "" }));
</script>
</body>
</html>
