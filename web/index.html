<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kSEE</title>
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<div id="app">
<aside class="col" id="side">
  <h2 id="ex-head"><b>kSEE</b></h2>
  <div class="body" id="examples"></div>
  <h2 class="sub fold" id="console-head" title="click: open or fold the console; drag, when open: its height"><span id="console-tw">▸</span> Console</h2>
  <div class="body consolebox" id="pane-console"><pre id="console"></pre></div>
</aside>
<div class="vsplit" data-col="left" title="drag to resize"></div>
<div id="work">
<section id="history">
  <canvas id="overview" aria-label="the whole recording: which task ran when; the window below"></canvas>
  <div class="flamehead"><span id="chart-title" class="dim"></span><span id="chart-verbs" class="dim"></span><span id="legend"></span></div>
  <div class="flamescroll" id="chartbox"><canvas id="chart" aria-label="the call stacks over time"></canvas></div>
  <canvas id="strip" aria-label="which task ran"></canvas>
  <div class="transport">
    <button id="step-back" title="In time: the line before (←), at the level: that deep or shallower (with none, any)">◀</button>
    <button id="step-fwd" title="In time: the next line (→), at the level: that deep or shallower (with none, any)">▶</button>
    <span id="level" class="dim" title="the level ◀ ▶ step at: set by selecting a call (a click, ▲ ▼)"></span>
    <button id="step-up" title="In depth: the level one row up on the Stack, the callee (↑); past the innermost, ∞: every line">▲</button>
    <button id="step-down" title="In depth: the level one row down on the Stack, the caller (↓); from ∞, the innermost">▼</button>
    <span id="where" class="mono dim"></span><span id="status" class="dim">loading the kernel…</span>
  </div>
</section>
<div class="hsplit" id="hsplit" title="drag to resize"></div>
<main id="main">
  <div class="col">
    <div class="srcbar mono" id="fn-title">Source</div>
    <div class="body" id="src"><div class="empty">The source at the cursor: the lines that ran are green (hover a line number: how often).</div></div>
  </div>
  <div class="vsplit" data-col="right" title="drag to resize"></div>
  <div class="col" id="right" data-tab="stack">
    <h2 class="tabs">
      <a data-tab="stack" title="the calls at the cursor, their values as they were then">Stack</a>
      <a data-tab="tasks" title="every task the recording has, at the cursor: where each is, its task_struct">Tasks</a>
      <a data-tab="objects" title="the objects the selected call wrote, and how they point to each other">Objects</a>
      <a data-tab="trace" title="the raw trace around the cursor: what the views are built from">Trace</a>
    </h2>
    <div class="pane" data-tab="stack">
      <div class="stackhead dim" id="stack-note"></div>
      <div class="body" id="stack"></div>
    </div>
    <div class="pane" data-tab="tasks">
      <div class="stackhead dim" id="tasks-note"></div>
      <div class="body" id="tasks"></div>
    </div>
    <div class="pane" data-tab="trace">
      <div class="stackhead dim" id="trace-note"></div>
      <div class="body" id="trace"></div>
    </div>
    <div class="pane" data-tab="objects">
      <div class="stackhead dim" id="objects-note"></div>
      <div class="body" id="objects"></div>
    </div>
  </div>
</main>
</div>
</div>
<script type="module">
import { start } from "./ksee.js";
import { app } from "./app.js";

// (window.ksee: for the console, and tests/ui.js)
try {
  window.ksee = app(await start({ kernel: "./vmlinux.gz", initrd: "./initramfs.cpio.gz", }));
} catch (e) {
  document.getElementById("status").textContent = e.message;
  throw e;
}
</script>
</body>
</html>
