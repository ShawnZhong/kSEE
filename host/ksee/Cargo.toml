[package]
name = "ksee"
version = "0.1.0"
edition = "2024"
description = "kSEE host runtime: runs in the kernel's shared memory"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
